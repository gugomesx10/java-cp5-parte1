server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  rabbitmq:
    addresses: ${CLOUDAMQP_URL}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

  jackson:
    serialization:
      indent-output: true

  mvc:
    hiddenmethod:
      filter:
        enabled: true

integracao:
  banco-tranquilo:
    base-url: ${BANCO_TRANQUILO_URL:http://localhost:8083}

  brevo:
    api-key: ${BREVO_API_KEY}
    remetente: ${BREVO_SENDER_EMAIL}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

  email-datasource:
    url: ${EMAIL_DB_URL}
    username: ${EMAIL_DB_USERNAME}
    password: ${EMAIL_DB_PASSWORD}